# QO-100 NB settings, read by nbctl.sh (copy to /boot/nb/nb.conf).
# nbd options (see nbd --help); --wisdom and --quiet are added by nbctl.sh.
# --tx: SSB transmitter for the app (the RF stays muted until the app
# unmutes it over MQTT, after the Arduino PTT).
# --beacon 10489750000: frequency lock on the BPSK centre beacon (nbd squares
# it); leave it out to lock on the CW beacon at 10489.500.
NBD_ARGS="--source pluto --ws 8073 --tx --beacon 10489750000"
# Mode at the first boot: nb (default) or datv. After that the board
# restarts in the mode it was left in (STOP in the app: datv). A DATV start
# (Webtioune, Android-DATV) always takes the radio, and its stop gives it
# back to nb.
BOOT_MODE=nb
