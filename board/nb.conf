# QO-100 NB settings, read by nbctl.sh (copy to /boot/nb/nb.conf).
# nbd options (see nbd --help); --wisdom and --quiet are added by nbctl.sh.
NBD_ARGS="--source pluto --ws 8073"
# Mode at boot: nb (default) or datv. A DATV start (Webtioune,
# Android-DATV) always takes the radio, and its stop gives it back to nb.
BOOT_MODE=nb
